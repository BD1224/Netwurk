<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Netwurk tab icon: people (outer dots) linked up to a hub (centre), on the app's ink colour. -->
  <rect width="64" height="64" rx="15" fill="#09090B"/>
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.5">
    <line x1="32" y1="33" x2="15" y2="16"/>
    <line x1="32" y1="33" x2="50" y2="14"/>
    <line x1="32" y1="33" x2="53" y2="42"/>
    <line x1="32" y1="33" x2="32" y2="54"/>
    <line x1="32" y1="33" x2="11" y2="44"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="15" cy="16" r="5.5"/>
    <circle cx="50" cy="14" r="5.5"/>
    <circle cx="53" cy="42" r="5.5"/>
    <circle cx="32" cy="54" r="5.5"/>
    <circle cx="11" cy="44" r="5.5"/>
    <circle cx="32" cy="33" r="9"/>
  </g>
  <circle cx="32" cy="33" r="3.5" fill="#09090B"/>
</svg>
